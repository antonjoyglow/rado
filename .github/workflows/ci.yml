name: CI

on:
  pull_request:
    branches: [main, "release/**"]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The Rust build embeds dist/ (tauri.conf.json frontendDist), so it needs the frontend built.
      - run: npm ci
      - run: npx vite build
      # Removed first, so a file left behind by a removed or renamed Rust type shows as drift too.
      - run: rm src/bindings/*.ts
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated TS types match the Rust ones
        shell: bash
        run: |
          changed=$(git status --porcelain src/bindings)
          if [ -n "$changed" ]; then
            echo "$changed"; git diff src/bindings
            echo "::error::src/bindings is out of date: run cargo test, delete any file listed as D, and commit the result"; exit 1
          fi
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
