name: CI

on:
  pull_request:
    branches: [main, "release/**"]

jobs:
  node:
    runs-on: ubuntu-latest
    # Playwright's image pins the browser and the fonts; with the runner's own fonts the e2e layout cases
    # measure differently. Keep its version equal to @playwright/test's.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run e2e

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ink
      # The Rust build embeds dist/ (tauri.conf.json frontendDist), so it needs the frontend built.
      - run: npm ci
      - run: npx vite build
      # Removed first, so a file left behind by a removed or renamed Rust type shows as drift too.
      - run: rm src/bindings/*.ts
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated TS types and the device's list fixture match the Rust ones
        shell: bash
        run: |
          changed=$(git status --porcelain src/bindings ink/fixtures)
          if [ -n "$changed" ]; then
            echo "$changed"; git diff src/bindings ink/fixtures
            echo "::error::src/bindings or ink/fixtures is out of date: run cargo test, delete any file listed as D, and commit the result"; exit 1
          fi
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path ink/Cargo.toml -p ink-core
      - run: cargo clippy --manifest-path ink/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path ink/Cargo.toml -p ink-app --no-default-features --features device -- -D warnings
