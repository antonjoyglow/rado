name: CI

on:
  pull_request:
    branches: [main, "release/**"]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated TS types match the Rust ones
        shell: bash
        run: |
          changed=$(git status --porcelain src/bindings)
          if [ -n "$changed" ]; then
            echo "$changed"; git diff src/bindings
            echo "::error::src/bindings is out of date: run cargo test and commit the result"; exit 1
          fi
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
